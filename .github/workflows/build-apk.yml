name: Build and Release OFFGRID Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Prepare Assets Directory
        run: |
          mkdir -p android/app/src/main/assets
          touch android/app/src/main/assets/index.android.bundle

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:processReleaseResources :app:assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OFFGRID-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release for Users
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest
          name: "CrisisCache Latest Release (APK)"
          body: |
            ## CrisisCache (OFFGRID) Android APK
            Direct download link for the latest CrisisCache Android release build.
            - **File**: `app-release.apk`
            - **Commit**: ${{ github.sha }}
          files: android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
